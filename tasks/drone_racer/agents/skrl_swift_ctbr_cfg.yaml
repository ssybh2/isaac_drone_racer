seed: 1

# Swift-style policy-0 PPO profile.
# This policy is trained FROM SCRATCH on the vectorized ideal CTBR task.
# It is never initialized from the legacy direct-motor checkpoints.
models:
  separate: True

  policy:
    class: GaussianMixin
    clip_actions: True
    clip_mean_actions: False
    clip_log_std: True
    min_log_std: -4.605170185988091   # std = 0.01
    max_log_std: -0.6931471805599453  # std = 0.50
    initial_log_std: -1.3862943611198906  # std = 0.25
    network:
      - name: net
        input: STATES
        layers: [128, 128]
        activations: leaky_relu
    # Keep the deterministic mean inside the normalized CTBR contract.
    output: tanh(ACTIONS)

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [128, 128]
        activations: leaky_relu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  # 100 vectorized envs x 128 control steps = 12,800 transitions/update.
  rollouts: 128
  learning_epochs: 5
  mini_batches: 8

  # Swift / PPO hyperparameters.
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.02
    min_lr: 3.0e-05
    max_lr: 3.0e-04

  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.001
  value_loss_scale: 1.0
  kl_threshold: 0.0

  # Reward coefficients are already calibrated in the IsaacLab RewardTerms.
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False

  experiment:
    directory: "swift_ctbr_policy0"
    experiment_name: "easy7_gt_31d_from_scratch"
    write_interval: auto
    checkpoint_interval: 10000

trainer:
  class: SequentialTrainer
  # At 100 envs this corresponds to 20 million environment interactions.
  # We will first run a much shorter smoke/audit before committing to this.
  timesteps: 200000
  environment_info: log
