seed: 1

# Learned-inertial PPO profile for bounded motor-action training.
#
# This profile is intentionally separate from skrl_cfg.yaml so the legacy
# Stage 1 / oracle tasks keep their original policy and optimizer settings.
models:
  separate: False
  policy:
    class: GaussianMixin
    # LearnedInertialRacingEnv exposes a finite [-1, 1]^4 action space.
    # Clipping here therefore happens before the action is stored by PPO,
    # avoiding the previous policy-vs-environment hard-clipping mismatch.
    clip_actions: True
    clip_mean_actions: False
    clip_log_std: True
    min_log_std: -20.0
    # log(0.05): keep stochastic exploration small enough that clipping is rare
    # after the migrated actor has been brought back into the tanh linear region.
    max_log_std: -2.995732273553991
    initial_log_std: -2.995732273553991
    network:
      - name: net
        input: STATES
        layers: [256, 256, 256]
        activations: elu
    # Keep the legacy trainable output layer shape for checkpoint compatibility.
    # A one-time transfer calibration rescales that layer before training so
    # tanh starts in a useful-gradient region instead of saturating immediately.
    output: tanh(ACTIONS)

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  # With one sensor-faithful environment, 1024 steps gives several complete
  # episodes per PPO update instead of roughly one trajectory.
  rollouts: 1024
  learning_epochs: 5
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.02
    min_lr: 5.0e-06
    max_lr: 2.0e-05
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  # Do not encourage the global Gaussian std to grow again.
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.6
  time_limit_bootstrap: False
  experiment:
    directory: "learned_inertial_rl_phase2_transfer"
    experiment_name: "easy_swift_recalibrated"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 51200
  environment_info: log
