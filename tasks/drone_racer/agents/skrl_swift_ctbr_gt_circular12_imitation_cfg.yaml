seed: 1

# BC/DAgger-initialized PPO. Preserve the validated 31D -> 256^3 ELU -> 4D
# CTBR actor while learning an independent critic. Stage-A is deliberately
# conservative so PPO cannot erase the zero-tumble BC manifold.
models:
  separate: True

  policy:
    class: GaussianMixin
    clip_actions: True
    clip_mean_actions: False
    clip_log_std: True
    min_log_std: -20.0
    # Stage-A begins from a validated zero-tumble BC. Keep exploration
    # deliberately local: std <= 0.02 so PPO cannot immediately erase the
    # collision-free behavior with large stochastic CTBR commands.
    max_log_std: -3.912023005428146
    initial_log_std: -4.605170185988091
    network:
      - name: net
        input: STATES
        layers: [256, 256, 256]
        activations: elu
    output: tanh(ACTIONS)

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 24
  learning_epochs: 2
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 1.0e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.003
    max_lr: 1.0e-05

  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.05
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 0.5
  kl_threshold: 0.005
  rewards_shaper_scale: 0.6
  time_limit_bootstrap: False

  experiment:
    directory: "swift_ctbr_gt_circular12_imitation_finetune"
    experiment_name: "circular12_bc_dagger_to_ppo"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 24000
  environment_info: log
