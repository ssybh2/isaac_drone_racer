seed: 1

# BC/DAgger-initialized PPO. Keep the same 31D -> 256^3 ELU -> 4D CTBR actor
# contract, but use a smaller learning rate and exploration envelope.
models:
  separate: False

  policy:
    class: GaussianMixin
    clip_actions: True
    clip_mean_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: -1.6094379124341003
    initial_log_std: -2.995732273553991
    network:
      - name: net
        input: STATES
        layers: [256, 256, 256]
        activations: elu
    output: tanh(ACTIONS)

  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [256, 256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 24
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-05
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
    max_lr: 1.0e-04

  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null

  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.15
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.001
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.6
  time_limit_bootstrap: False

  experiment:
    directory: "swift_ctbr_gt_circular12_imitation_finetune"
    experiment_name: "circular12_bc_dagger_to_ppo"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 24000
  environment_info: log
