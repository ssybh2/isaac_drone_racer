is_finite_horizon: false
episode_length_s: 20
rewards:
  terminating:
    func: isaaclab.envs.mdp.rewards:is_terminated
    params: {}
    weight: -500.0
  ang_vel_l2:
    func: tasks.drone_racer.mdp.rewards:ang_vel_l2
    params: {}
    weight: -0.0001
  progress:
    func: tasks.drone_racer.mdp.rewards:progress
    params:
      command_name: target
    weight: 20.0
  gate_passed:
    func: tasks.drone_racer.mdp.rewards:gate_passed
    params:
      command_name: target
    weight: 400.0
  lookat_next:
    func: tasks.drone_racer.mdp.rewards:lookat_next_gate
    params:
      command_name: target
      std: 0.5
    weight: 0.1
terminations:
  time_out:
    func: isaaclab.envs.mdp.terminations:time_out
    params: {}
    time_out: true
  flyaway:
    func: tasks.drone_racer.mdp.terminations:flyaway
    params:
      command_name: target
      distance: 20.0
    time_out: false
  collision:
    func: isaaclab.envs.mdp.terminations:illegal_contact
    params:
      sensor_cfg:
        name: collision_sensor
        joint_names: null
        joint_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        fixed_tendon_names: null
        fixed_tendon_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        body_names: null
        body_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        object_collection_names: null
        object_collection_ids: !!python/object/apply:builtins.slice
        - null
        - null
        - null
        preserve_order: false
      threshold: 0.01
    time_out: false
curriculum: null
commands:
  target:
    class_type: tasks.drone_racer.mdp.commands:GateTargetingCommand
    resampling_time_range: !!python/tuple
    - 1000000000.0
    - 1000000000.0
    debug_vis: true
    asset_name: robot
    track_name: track
    randomise_start: true
    record_fpv: false
    gate_size: 1.5
    target_visualizer_cfg:
      prim_path: /Visuals/Command/goal_pose
      markers:
        frame:
          func: isaaclab.sim.spawners.from_files.from_files:spawn_from_usd
