name: Regenerate Circular12 High-Contrast Textures

on:
  push:
    branches:
      - feature/racing-vision-retraining
    paths:
      - "scripts/perception/generate_circular12_gate_textures.py"
      - "assets/gate/textures/circular12_gate_texture_map.json"
      - ".github/workflows/regenerate-circular12-high-contrast-textures.yaml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/racing-vision-retraining
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Regenerate high-contrast textures
        run: python scripts/perception/generate_circular12_gate_textures.py

      - name: Commit generated PNG changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/gate/textures/circular12
          if git diff --cached --quiet; then
            echo "No generated texture changes."
            exit 0
          fi
          git commit -m "feat(assets): regenerate high-contrast Circular12 textures"
          git push origin HEAD:feature/racing-vision-retraining
