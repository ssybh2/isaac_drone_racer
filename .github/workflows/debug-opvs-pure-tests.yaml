name: debug-opvs pure checks

on:
  push:
    branches: [debug-opvs]
  pull_request:
    branches: [swift1]

jobs:
  pure-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pure-test dependencies
        run: python -m pip install --upgrade pip pytest numpy pyyaml
      - name: Compile diagnostic Python
        run: |
          python -m py_compile scripts/estimation/run_openvins_fault_isolation.py
          python -m py_compile estimation/openvins_bridge.py
          python -m py_compile estimation/vio_time_buffer.py
          python -m py_compile estimation/swift_vio_drift.py
      - name: Run OpenVINS pure regressions
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/estimation/test_openvins_config.py \
            tests/estimation/test_openvins_bridge.py \
            tests/estimation/test_vio_time_buffer.py \
            tests/estimation/test_swift_vio_drift.py \
            tests/estimation/test_timestamped_gate_queue.py
